  <h2>주소를 치면 일어나는 일</h2>
  <ol>
    <li><strong>DNS 조회</strong> — 도메인 이름을 IP 주소로 바꾼다</li>
    <li><strong>HTTP 요청</strong> — 서버에 문서를 달라고 보낸다</li>
    <li><strong>HTTP 응답</strong> — 서버가 HTML과 상태 코드를 돌려준다</li>
    <li><strong>파싱·렌더링</strong> — 브라우저가 HTML·CSS를 해석하고 JS를 실행한다</li>
    <li><strong>화면에 그리기</strong> — 계산된 결과를 픽셀로 칠한다</li>
  </ol>
